services:
  agent-claude:
    image: mimo:local
    working_dir: /app/packages/mimo-agent
    mem_limit: 4g
    memswap_limit: 4g
    command: ["/app/.container/init-agent.sh"]
    environment:
      PORT: "3001"
      AGENT_PROVIDER: claude
      AGENT_JWT: ${CLAUDE_AGENT_JWT}
      HOME: "/home/app"
      PATH: "/home/app/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      USER: "app"
      LOGNAME: "app"
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    depends_on:
      platform:
        condition: service_healthy
    volumes:
      - mimo-home-agent:/home/app
      - ~/.claude:/home/app/.claude
      - ~/.claude.json:/home/app/.claude.json
      - ~/.mimo-agent-container:/home/app/.mimo-agent
      - ~/.ssh-mimo:/home/app/.ssh:ro
    restart: unless-stopped
